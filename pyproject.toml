[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protflow"
version = "0.1.0"
description = "Minimal, friction-free bio-computational pipeline backbone"
authors = [{ name = "ProtFlow Team" }]
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.28",
    "pyrodigal>=3.0",
    "gemmi>=0.6.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["protflow*"]
